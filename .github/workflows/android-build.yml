name: Android Build

# Builds installable APKs on every push that touches the android/ project.
# Signed release artifacts are produced only when the four ANDROID_* secrets
# are configured on the repository (see android/README.md, "Signing").

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK (always, for quick sideload testing)
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK + AAB (only if signing secrets exist)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > keystore/pixkitapp-release.jks
            printf 'storeFile=keystore/pixkitapp-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            echo "Release signing secrets are not configured on this repo; skipping signed release build."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PixKitApp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: PixKitApp-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
