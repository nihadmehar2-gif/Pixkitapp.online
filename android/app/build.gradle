plugins {
    id 'com.android.application'
}

// Release signing is read from keystore.properties (git-ignored).
// If the file is absent, release builds fall back to the debug key so the
// project always compiles. See README.md "Signing" for how to set it up.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.pixkitapp.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.pixkitapp.app"
        minSdk 24          // Android 7.0 (~98% of active devices)
        targetSdk 36       // Android 16 - satisfies Google Play / Galaxy Store 2026 target-API policy
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Official AndroidX workaround: some transitive androidx modules still
    // declare kotlin-stdlib-jdk7/-jdk8 1.6.x, which duplicates classes that
    // were merged into kotlin-stdlib 1.8.x.
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
